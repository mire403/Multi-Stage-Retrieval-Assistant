# LayeredRetriever Configuration

# LLM Settings
llm:
  provider: "openai"  # openai, anthropic, local
  model: "gpt-4-turbo-preview"
  temperature: 0.1
  max_tokens: 2000
  api_key_env: "OPENAI_API_KEY"

# Embedding Settings
embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"  # cpu, cuda
  batch_size: 32

# Stage 1: Broad Retrieval
stage1:
  strategy: "hybrid"  # hybrid, keyword, vector, metadata
  vector_k: 200  # Number of candidates from vector search
  keyword_k: 100  # Number of candidates from keyword search
  final_k: 200  # Final candidate pool size
  min_score: 0.0  # Minimum score threshold

# Stage 2: Semantic Refinement
stage2:
  use_llm_judge: true  # Use LLM for relevance judgment
  use_cross_encoder: false  # Use cross-encoder for re-ranking
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_contexts: 10  # Maximum contexts after refinement
  min_relevance_score: 0.5  # Minimum relevance score
  enable_subquestion_decomposition: true

# Stage 3: Answer Synthesis
stage3:
  max_context_tokens: 4000
  require_citations: true
  output_format: "structured"  # structured, markdown, plain
  confidence_threshold: 0.6

# Storage
storage:
  vector_store:
    type: "chroma"  # chroma, faiss
    persist_directory: "./data/vector_store"
    collection_name: "documents"
  
  doc_store:
    type: "memory"  # memory, json, database
    path: "./data/doc_store.json"

# Query Analysis
query_analysis:
  enable_intent_detection: true
  enable_constraint_extraction: true
  enable_multi_hop_detection: true

# Pipeline
pipeline:
  enable_dry_run: true
  dry_run_stage: null  # null, stage1, stage2, stage3
  enable_tracing: true
  trace_output_path: "./data/traces"

# Logging
logging:
  level: "INFO"
  format: "detailed"
